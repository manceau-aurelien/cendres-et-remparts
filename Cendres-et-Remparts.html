<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cendres et Remparts</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: manipulation; }
  [hidden] { display: none !important; }
  #salon { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 9, 9, .6); }
  #salon > div { box-sizing: border-box; width: min(580px, 94vw); max-height: 94vh; overflow: auto; background: #1d2220; border: 3px solid #5d6b62; border-radius: 16px; padding: 24px 28px; color: #eee; font-size: 17px; line-height: 1.45; }
  #salon h2 { margin: 0 0 14px; color: #ffe3b0; font-size: 28px; }
  #salon p { margin: 10px 0; }
  #salon button { font: bold 18px "Trebuchet MS", sans-serif; color: #fff; background: #34403a; border: 2px solid #5d6b62; border-radius: 10px; padding: 11px 18px; margin: 4px 6px 4px 0; cursor: pointer; }
  #salon button:hover, #salon button:focus-visible { border-color: #9fd16b; background: #4a5a52; outline: none; }
  #salon input, #salon textarea { box-sizing: border-box; background: #101312; color: #fff; border: 2px solid #5d6b62; border-radius: 10px; padding: 10px; font: 18px Consolas, monospace; }
  #salon input { width: 190px; letter-spacing: 4px; text-transform: uppercase; }
  #salon textarea { width: 100%; height: 74px; font-size: 12px; resize: none; }
  #salon details { margin-top: 18px; color: #c5cfc8; font-size: 15px; }
  #salon summary { cursor: pointer; }
  #code { font: bold 46px Consolas, monospace; letter-spacing: 8px; color: #9fd16b; }
  #info { min-height: 1.4em; color: #ffd04a; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<div id="salon" hidden><div>
  <h2>Jouer en ligne</h2>
  <div id="s-choix">
    <p><button id="b-creer">Créer une partie</button></p>
    <p>ou rejoindre : <input id="i-code" maxlength="6" autocomplete="off" spellcheck="false" aria-label="Code de la partie"> <button id="b-rejoindre">Rejoindre</button></p>
  </div>
  <div id="s-code" hidden>
    <p>Donnez ce code à votre ami :</p>
    <p><span id="code"></span> <button id="b-copier">Copier</button></p>
  </div>
  <p id="info" role="status"></p>
  <p id="s-go" hidden><button id="b-go">Commencer</button></p>
  <details id="s-manuel">
    <summary>Le code ne marche pas ? Échange manuel</summary>
    <p>L'hôte : <button id="b-inviter">1. Créer une invitation</button></p>
    <textarea id="t-a" placeholder="Invitation : l'hôte la copie et l'envoie ; l'ami la colle ici" aria-label="Invitation"></textarea>
    <p>L'ami : <button id="b-accepter">2. Répondre à l'invitation</button></p>
    <textarea id="t-b" placeholder="Réponse : l'ami la copie et la renvoie ; l'hôte la colle ici" aria-label="Réponse"></textarea>
    <p>L'hôte : <button id="b-conclure">3. Se connecter</button></p>
  </details>
  <p><button id="b-retour">Retour au menu</button></p>
</div></div>
<script>
// Moteur de « Cendres et Remparts » : aucune dépendance à l'affichage.
// Tout passe par partie.ordre(joueur, action) : c'est ce qui permettra le jeu en ligne.
(function (racine) {
  'use strict';

  const L = 1600;                 // largeur du champ de bataille
  const PORTE = [150, L - 150];   // x de la porte de chaque château
  const AGES = ['Bois', 'Fer', 'Vapeur', 'Éclair', 'Astres'];
  const COUT_AGE = [450, 900, 1600, 2600];
  const FORCE_AGE = 1.4;          // chaque âge multiplie PV et dégâts, y compris de l'existant
  const MAX_UNITES = [14, 14, 26];
  // Réglages d'équilibre (voir equilibrage.js)
  const R = { croissance: 1.13, revCroissance: 1.07, base: 1.15, revBase: 10.5, chateau: 1600, crepuscule: 210, palier: 60, rageIA: 0.2, siege: 1.5, usure: 0.8, cendres: 0.0012,
    force: { agressif: 1.22, defensif: 0.85, ruse: 1 } };

  const UNITES = {
    lancier:  { nom: 'Lancier',  cout: 30,  pv: 100, deg: 12, cd: 0.9, portee: 36,  vit: 55,  fort: 'cavalier', bonus: 1.8, chateau: 1 },
    archer:   { nom: 'Archer',   cout: 45,  pv: 55,  deg: 11, cd: 1.1, portee: 210, vit: 50,  fort: 'lancier',  bonus: 1.5, chateau: 0.6 },
    cavalier: { nom: 'Cavalier', cout: 70,  pv: 130, deg: 16, cd: 0.8, portee: 38,  vit: 110, fort: 'archer',   bonus: 2,   chateau: 1 },
    colosse:  { nom: 'Colosse',  cout: 140, pv: 420, deg: 26, cd: 1.6, portee: 44,  vit: 36,  fort: null,       bonus: 1,   chateau: 3 },
  };
  const DEFENSES = {
    baliste: { nom: 'Baliste', cout: 110, deg: 18, cd: 1.0, portee: 430, zone: 0,  max: 3 },
    mortier: { nom: 'Mortier', cout: 180, deg: 24, cd: 2.4, portee: 520, zone: 75, max: 3 },
  };
  const ACTIONS = ['lancier', 'archer', 'cavalier', 'colosse', 'assaut', 'baliste', 'mortier', 'barricade', 'mine', 'age'];

  // Renforts permanents : un niveau par choix ; chaque 5e niveau compte double.
  const RENFORTS = {
    lames:     { nom: 'Lames',      pas: 0.10, texte: 'Dégâts des soldats' },
    armures:   { nom: 'Armures',    pas: 0.10, texte: 'Vie des soldats' },
    remparts:  { nom: 'Remparts',   pas: 0.15, texte: 'Vie du château et des barricades' },
    artillerie:{ nom: 'Artillerie', pas: 0.15, texte: 'Dégâts des défenses' },
    filons:    { nom: 'Filons',     pas: 0.08, texte: 'Revenu en or' },
    coffres:   { nom: 'Coffres',    pas: 0.40, texte: 'Or de départ' },
    savoir:    { nom: 'Savoir',     pas: 0.08, texte: 'Âges moins chers' },
    butin:     { nom: 'Butin',      pas: 0.25, texte: 'Or gagné par ennemi vaincu' },
  };
  const ADVERSAIRES = [
    { nom: 'Ronce',    titre: 'la Meute',   style: 'agressif',  desc: 'Attaque sans relâche avec des troupes rapides.' },
    { nom: 'Granit',   titre: 'le Bastion', style: 'defensif',  desc: 'Se couvre de défenses, puis envoie des colosses.' },
    { nom: 'Vespérine',titre: 'l\'Énigme',  style: 'ruse',      desc: 'Recrute toujours ce qui contre vos troupes.' },
  ];
  const STYLES = {
    agressif: { partAge: 0.16, vague: 0.82, def: 0.08, mine: 0.10, poids: { lancier: 4, archer: 2, cavalier: 4, colosse: 1 }, taille: [2, 4], contre: 0.1 },
    defensif: { partAge: 0.26, vague: 0.55, def: 0.30, mine: 0.15, poids: { lancier: 2, archer: 4, cavalier: 1, colosse: 3 }, taille: [3, 6], contre: 0.1 },
    ruse:     { partAge: 0.22, vague: 0.68, def: 0.16, mine: 0.16, poids: { lancier: 3, archer: 3, cavalier: 3, colosse: 2 }, taille: [2, 5], contre: 0.75 },
    allie:    { partAge: 0.24, vague: 0.64, def: 0.18, mine: 0.18, poids: { lancier: 3, archer: 3, cavalier: 2, colosse: 2 }, taille: [2, 4], contre: 0.5 },
  };
  const CONTRE = { lancier: 'archer', archer: 'cavalier', cavalier: 'lancier', colosse: 'lancier' };

  function adversaire(niveau) {
    const a = ADVERSAIRES[(niveau - 1) % ADVERSAIRES.length];
    const tour = Math.floor((niveau - 1) / ADVERSAIRES.length);
    return Object.assign({}, a, { nom: a.nom + (tour ? ' ' + 'I'.repeat(Math.min(tour + 1, 3)) + (tour > 2 ? '+' + (tour - 2) : '') : '') });
  }
  const valeurRenfort = (cle, niv) => RENFORTS[cle].pas * (niv + Math.floor(niv / 5));

  function creerPartie(opt) {
    const niveau = opt.niveau || 1;
    const perm = {};
    for (const k in RENFORTS) perm[k] = valeurRenfort(k, (opt.renforts || {})[k] || 0);
    let graine = (opt.graine || 1) >>> 0;
    const hasard = () => { // mulberry32 : reproductible
      graine = (graine + 0x6D2B79F5) >>> 0;
      let t = graine;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const adv = adversaire(niveau);
    // au-delà du 11e adversaire la montée ralentit, pour que les renforts continuent de compter
    const rang = Math.min(niveau - 1, 10) + Math.max(0, niveau - 11) * 0.5;
    const forceAdv = R.base * R.force[adv.style] * Math.pow(R.croissance, rang);
    const revAdv = Math.pow(R.revCroissance, rang);

    const p = {
      niveau, adv, perm, t: 0, fini: null, id: 1,
      unites: [], tirs: [], evts: [],
      joueurs: [0, 1, 2].map(i => ({
        i, equipe: i === 2 ? 1 : 0, or: i === 2 ? 130 : Math.round(80 * (1 + perm.coffres)),
        mines: 0, def: { baliste: 0, mortier: 0 }, recharge: 0, appel: 0, tues: 0,
        ia: i === 2 ? adv.style : (opt.bots && opt.bots[i] ? 'allie' : null),
        pense: 0.5 + i * 0.2, but: null, file: [], attente: 0,
      })),
      camps: [0, 1].map(e => ({
        age: 0, fonds: 0, pv: 0, max: 0, cdTir: 0, cdDef: {}, assaut: 0, jauge: 0, touche: 0,
      })),
    };
    const baseChateau = e => R.chateau * (e === 0 ? 1 + perm.remparts : forceAdv);
    for (const e of [0, 1]) p.camps[e].pv = p.camps[e].max = baseChateau(e);

    // --- Forces -----------------------------------------------------------
    const ageMul = e => Math.pow(FORCE_AGE, p.camps[e].age);
    // Crépuscule : passé ce délai, les murs s'effritent et l'IA s'emballe ; aucune partie ne s'éternise.
    const nuit = () => Math.max(0, p.t - R.crepuscule) / R.palier;
    const rage = () => 1 + nuit() * R.rageIA;
    const siege = () => 1 + nuit() * R.siege;
    const usure = () => 1 / (1 + nuit() * R.usure);
    function multPv(e) { return ageMul(e) * (e === 0 ? 1 + perm.armures : forceAdv); }
    function multDeg(e) {
      return ageMul(e) * (e === 0 ? 1 + perm.lames : forceAdv * rage()) * (p.camps[e].assaut > 0 ? 1.5 : 1);
    }
    function multDef(e) { return usure() * ageMul(e) * (e === 0 ? 1 + perm.artillerie : forceAdv); }
    function pvBarricade(e) { return 480 * ageMul(e) * (e === 0 ? 1 + perm.remparts : forceAdv); }
    const revenu = j => j.equipe === 0
      ? (5 + 1.6 * j.mines) * (1 + perm.filons)
      : (R.revBase + 2.2 * j.mines) * revAdv * (1 + p.t / 60 * 0.05);

    const compte = (i, type) => p.unites.filter(u => u.prop === i && (!type ? u.type !== 'barricade' : u.type === type)).length;
    const barricade = i => p.unites.find(u => u.prop === i && u.type === 'barricade');
    function coutAge(e) {
      const c = COUT_AGE[p.camps[e].age];
      if (c === undefined) return null;
      return Math.round(e === 0 ? c / (1 + perm.savoir) : c);
    }
    function cout(i, a) {
      const j = p.joueurs[i];
      if (UNITES[a]) return UNITES[a].cout;
      if (DEFENSES[a]) return Math.round(DEFENSES[a].cout * Math.pow(1.6, j.def[a]));
      if (a === 'barricade') return 80;
      if (a === 'mine') return Math.round(90 * Math.pow(1.45, j.mines));
      if (a === 'age') {
        const c = coutAge(j.equipe);
        return c === null ? 0 : Math.min(50, c - p.camps[j.equipe].fonds);
      }
      return 0;
    }
    // '' si possible, sinon la raison
    function blocage(i, a) {
      const j = p.joueurs[i], c = p.camps[j.equipe];
      if (p.fini) return 'Terminé';
      if (UNITES[a]) {
        if (compte(i) >= MAX_UNITES[i]) return 'Armée pleine';
        if (j.recharge > 0) return '…';
      } else if (DEFENSES[a]) {
        if (j.def[a] >= DEFENSES[a].max * (i === 2 ? 1.34 : 1)) return 'Maximum';
      } else if (a === 'barricade') {
        const b = barricade(i);
        if (b && b.pv >= b.max * 0.98) return 'Intacte';
      } else if (a === 'mine') {
        if (j.mines >= 6) return 'Maximum';
      } else if (a === 'age') {
        if (coutAge(j.equipe) === null) return 'Âge final';
      } else if (a === 'assaut') {
        if (c.assaut > 0) return 'En cours';
        if (c.jauge < 100) return 'Jauge ' + Math.floor(c.jauge) + ' %';
        if (j.appel > 0) return 'Appel lancé !';
      }
      if (j.or < cout(i, a)) return 'Pas assez d\'or';
      return '';
    }
    function creerUnite(i, type) {
      const j = p.joueurs[i], e = j.equipe, b = UNITES[type];
      const pv = b.pv * multPv(e);
      p.unites.push({ id: p.id++, prop: i, equipe: e, type, x: PORTE[e], voie: hasard(), pv, max: pv, cd: 0.2 + hasard() * 0.3, frappe: 0, touche: 0 });
    }
    function ordre(i, a) {
      if (blocage(i, a)) { p.evts.push({ t: 'refus', i }); return false; }
      const j = p.joueurs[i], e = j.equipe, c = p.camps[e], prix = cout(i, a);
      j.or -= prix;
      if (UNITES[a]) { creerUnite(i, a); j.recharge = i === 2 ? 0.25 : 0.45; p.evts.push({ t: 'recrue', i }); }
      else if (DEFENSES[a]) { j.def[a]++; p.evts.push({ t: 'construit', i, x: PORTE[e] }); }
      else if (a === 'barricade') {
        const b = barricade(i), max = pvBarricade(e);
        if (b) { b.max = max; b.pv = max; }
        else {
          const d = i === 1 ? 290 : 220;
          p.unites.push({ id: p.id++, prop: i, equipe: e, type: 'barricade', x: e === 0 ? d : L - d, voie: 0.5, pv: max, max, cd: 9, frappe: 0, touche: 0 });
        }
        p.evts.push({ t: 'construit', i });
      } else if (a === 'mine') { j.mines++; p.evts.push({ t: 'construit', i }); }
      else if (a === 'age') {
        c.fonds += prix;
        p.evts.push({ t: 'verse', i });
        const but = coutAge(e);
        if (c.fonds >= but) monterAge(e);
      } else if (a === 'assaut') {
        j.appel = 5;
        p.evts.push({ t: 'appel', i });
        if (p.joueurs.filter(k => k.equipe === e).every(k => k.appel > 0)) {
          c.assaut = 10; c.jauge = 0;
          p.joueurs.forEach(k => { if (k.equipe === e) k.appel = 0; });
          p.evts.push({ t: 'assaut', e });
        }
      }
      return true;
    }
    function monterAge(e) {
      const c = p.camps[e];
      c.age++; c.fonds = 0;
      for (const u of p.unites) if (u.equipe === e) { u.pv *= FORCE_AGE; u.max *= FORCE_AGE; }
      const gain = c.max * 0.2;
      c.max += gain; c.pv = Math.min(c.max, c.pv + gain);
      p.evts.push({ t: 'age', e, age: c.age });
    }

    // --- Combat -----------------------------------------------------------
    function blesser(u, deg, par) {
      if (u.pv <= 0) return;
      u.pv -= deg; u.touche = 0.15;
      if (u.pv > 0) return;
      p.evts.push({ t: 'mort', x: u.x, voie: u.voie, type: u.type, e: u.equipe });
      if (u.type === 'barricade') return;
      const prix = UNITES[u.type].cout, vainq = 1 - u.equipe;
      p.camps[vainq].jauge = Math.min(100, p.camps[vainq].jauge + prix / 12);
      if (par !== undefined && par >= 0) p.joueurs[par].tues++;
      if (vainq === 0) { // butin partagé entre les deux joueurs
        const part = prix * 0.22 * (1 + perm.butin);
        p.joueurs[0].or += part; p.joueurs[1].or += part;
      } else p.joueurs[2].or += prix * 0.30;
    }
    function blesserChateau(e, deg) {
      const c = p.camps[e];
      c.pv -= deg * siege(); c.touche = 0.2;
      if (c.pv <= 0 && !p.fini) {
        c.pv = 0;
        p.fini = e === 1 ? 'victoire' : 'defaite';
        p.evts.push({ t: 'fin', r: p.fini });
      }
    }
    function tirer(genre, e, prop, x0, cible, deg, zone) {
      const dur = genre === 'mortier' ? 0.9 : 0.35;
      p.tirs.push({ genre, e, prop, x0, x1: cible ? cible.x : PORTE[1 - e], cible: cible ? cible.id : 0, deg, zone, t: 0, dur, voie: cible ? cible.voie : 0.5 });
    }
    function impact(s) {
      if (s.zone) {
        for (const u of p.unites) if (u.equipe !== s.e && Math.abs(u.x - s.x1) < s.zone) blesser(u, s.deg, s.prop);
        p.evts.push({ t: 'explosion', x: s.x1 });
      } else if (s.cible) {
        const u = p.unites.find(v => v.id === s.cible);
        if (u) blesser(u, s.deg, s.prop);
      } else blesserChateau(1 - s.e, s.deg);
    }
    function plusProche(e, x, portee) {
      let m = null, md = portee;
      for (const u of p.unites) {
        if (u.equipe === e || u.pv <= 0) continue;
        const d = Math.abs(u.x - x);
        if (d <= md) { md = d; m = u; }
      }
      return m;
    }
    function bougerUnite(u, dt) {
      u.frappe = Math.max(0, u.frappe - dt); u.touche = Math.max(0, u.touche - dt);
      if (u.type === 'barricade' || u.pv <= 0) return;
      const b = UNITES[u.type], e = u.equipe, sens = e === 0 ? 1 : -1;
      const furie = p.camps[e].assaut > 0;
      u.cd -= dt * (furie ? 1.25 : 1);
      const cible = plusProche(e, u.x, b.portee);
      const dChateau = Math.abs(PORTE[1 - e] - u.x);
      if (cible || dChateau <= b.portee) {
        if (u.cd <= 0) {
          u.cd = b.cd; u.frappe = 0.25;
          let deg = b.deg * multDeg(e);
          if (cible) {
            if (cible.type === b.fort) deg *= b.bonus;
            if (cible.type === 'barricade' && u.type === 'colosse') deg *= 2;
            if (u.type === 'archer') tirer('fleche', e, u.prop, u.x, cible, deg, 0);
            else { blesser(cible, deg, u.prop); p.evts.push({ t: 'coup', x: u.x }); }
          } else if (u.type === 'archer') tirer('fleche', e, u.prop, u.x, null, deg * b.chateau, 0);
          else { blesserChateau(1 - e, deg * b.chateau); p.evts.push({ t: 'coup', x: u.x }); }
        }
      } else u.x += sens * b.vit * (furie ? 1.3 : 1) * dt;
    }
    function defendre(e, dt) {
      const c = p.camps[e];
      c.cdTir -= dt;
      if (c.cdTir <= 0) { // les archers du château tirent toujours un peu
        const u = plusProche(e, PORTE[e], 280);
        if (u) { c.cdTir = 1.2; tirer('fleche', e, -1, PORTE[e], u, 9 * multDef(e), 0); }
      }
      for (const j of p.joueurs) if (j.equipe === e) for (const d in DEFENSES) for (let n = 0; n < j.def[d]; n++) {
        const k = j.i + d + n, D = DEFENSES[d];
        c.cdDef[k] = (c.cdDef[k] === undefined ? n * 0.3 : c.cdDef[k]) - dt;
        if (c.cdDef[k] > 0) continue;
        const u = plusProche(e, PORTE[e], D.portee);
        if (u) { c.cdDef[k] = D.cd; tirer(d, e, j.i, PORTE[e], u, D.deg * multDef(e), D.zone); }
      }
    }

    // --- Intelligence artificielle ----------------------------------------
    function tirage(poids) {
      let s = 0; for (const k in poids) s += poids[k];
      let r = hasard() * s;
      for (const k in poids) { r -= poids[k]; if (r <= 0) return k; }
      return Object.keys(poids)[0];
    }
    function choisirUnite(j, S) {
      if (hasard() < S.contre) {
        const n = {}; let m = null;
        for (const u of p.unites) if (u.equipe !== j.equipe && UNITES[u.type]) {
          n[u.type] = (n[u.type] || 0) + UNITES[u.type].cout;
          if (!m || n[u.type] > n[m]) m = u.type;
        }
        if (m) return CONTRE[m];
      }
      return tirage(S.poids);
    }
    function nouveauBut(j, S) {
      const c = { vague: S.vague, def: S.def, mine: S.mine * (j.mines < 2 ? 2 : j.mines < 5 ? 0.8 : 0) };
      const g = tirage(c);
      if (g === 'mine') return { a: 'mine' };
      if (g === 'def') {
        const a = tirage({ baliste: 4, mortier: 3, barricade: 2 });
        if (!['Maximum', 'Intacte'].includes(blocage(j.i, a))) return { a };
      }
      const n = S.taille[0] + Math.floor(hasard() * (S.taille[1] - S.taille[0] + 1)), liste = [];
      for (let k = 0; k < n; k++) liste.push(choisirUnite(j, S));
      // les troupes solides partent devant
      liste.sort((a, b) => UNITES[b].pv - UNITES[a].pv);
      return { vague: liste, prix: liste.reduce((s, t) => s + UNITES[t].cout, 0) };
    }
    function reflechir(j, dt) {
      const S = STYLES[j.ia], e = j.equipe;
      j.pense -= dt; j.attente += dt;
      if (j.ia === 'allie' && j.appel <= 0 && !blocage(j.i, 'assaut')) {
        const autre = p.joueurs[1 - j.i];

// Connexion directe entre deux navigateurs (WebRTC), sans bibliothèque.
// La mise en relation par code court passe par le service public ntfy.sh, en messages chiffrés ;
// l'échange manuel de codes longs s'en passe complètement.
(function () {
  'use strict';
  const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }] };
  const COURTIER = 'https://ntfy.sh/';
  const LETTRES = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sans I, L, O, 0, 1
  const SILENCE = 12000, DELAI = 25000;
  const alea = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), v => LETTRES[v % LETTRES.length]).join('');

  // le service ne voit ni le code, ni les adresses des joueurs contenues dans les messages.
  async function derive(code) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    const b = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode('cendres-et-remparts'), iterations: 250000 }, base, 384));

      canal: 'cer' + Array.from(b.slice(0, 16), v => v.toString(16).padStart(2, '0')).join(''),
      cle: await crypto.subtle.importKey('raw', b.slice(16), 'AES-GCM', false, ['encrypt', 'decrypt']),
    };
  }

    const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cle, new TextEncoder().encode(JSON.stringify(o))));

    return btoa(t);
  }

      heberger() {

        }, async o => {

          if (o.payload.occupe) return ev.erreur('Cette partie a déjà deux joueurs.');
          if (!pc || pc.signalingState !== 'have-local-offer') return;
          try { await pc.setRemoteDescription({ type: 'answer', sdp: String(o.payload.sdp) }); } catch (e) { ev.erreur('Réponse illisible.'); }
        });

      // --- Échange manuel : aucun service de mise en relation ---------------
      async inviter() { hote = true; return btoa(JSON.stringify(await offre())); },
      async accepter(texte) { return btoa(JSON.stringify(await reponse(JSON.parse(atob(texte.trim()))))); },
      async conclure(texte) { await pc.setRemoteDescription({ type: 'answer', sdp: String(JSON.parse(atob(texte.trim())).sdp) }); },

      },
    };
  }

})();

        g.strokeStyle = P.metal; g.lineWidth = 3; g.beginPath(); g.arc(8, y - 27, 15, -1.3, 1.3); g.stroke();
        ligne('#eee', 1, 12, y - 41, 6 - coup * 5, y - 27, 12, y - 13);
      }

    }

    if (r < 0.99) jauge(u.x - 17, yVoie(u.voie) - (u.type === 'colosse' ? 116 : u.type === 'cavalier' ? 92 : 74), 34, 5, r, r > 0.4 ? '#7bd35f' : '#e2553f');
  }
  function tirs() {
    for (const s of partie.tirs) {
      const k = s.t / s.dur, y0 = s.x0 === S.PORTE[s.e] ? SOL - 160 : yVoie(s.voie) - 28, y1 = yVoie(s.voie) - 25;
      const arc = s.genre === 'mortier' ? 170 : 26;

  }
  function eclats(x, y, n, c, v) {
    for (let k = 0; k < n && part.length < 400; k++) {
      const a = Math.random() * 6.3;
      part.push({ x, y, vx: Math.cos(a) * v * Math.random(), vy: -Math.abs(Math.sin(a)) * v * Math.random(), t: 0.4 + Math.random() * 0.4, c, r: 2 + Math.random() * 3 });
    }
  }
  function evenements() {
    if (mode === 'hote' && ami) evtsNet.push(...partie.evts);
    for (const e of partie.evts) {
      const nous = e.i !== undefined && e.i < 2;
      if (e.t === 'mort') { eclats(e.x, yVoie(e.voie) - 25, 10, e.e ? COUL.j[2] : '#cfc8bb', 160); sonRare('mort', 70, 190, 60, 0.18, 'sawtooth', 0.03); }
      else if (e.t === 'explosion') { eclats(e.x, SOL + 15, 18, '#ff9a3c', 230); secousse = Math.max(secousse, 0.12); sonRare('boum', 80, 110, 30, 0.3, 'sawtooth', 0.06); }

        son(e.e ? 300 : 440, e.e ? 150 : 1320, 0.8, 'triangle', 0.09);

      } else if (e.t === 'fin') {
        const v = e.r === 'victoire';

  }

  // --- Interface ------------------------------------------------------------------
  function bouton(x, y, w, h, s, f, sous) {
    const sur = zone(x, y, w, h, f);
    rect(x, y, w, h, 14, sur ? '#4a5a52' : '#2c3531', sur ? '#9fd16b' : '#5d6b62', 3);

  }
  function icone(a, x, y, i) {
    const P = PAL[partie.camps[0].age];
    if (S.UNITES[a]) {
      const k = a === 'colosse' ? 0.5 : a === 'cavalier' ? 0.62 : 0.8;
      g.save(); g.translate(x - 4, y + 26); g.scale(k, k); g.translate(0, -yVoie(0));

    } else if (a === 'assaut') poly('#ffd04a', x - 4, y - 22, x + 12, y - 22, x + 3, y - 5, x + 14, y - 5, x - 8, y + 24, x - 1, y + 3, x - 12, y + 3);
    else if (a === 'baliste') { g.strokeStyle = P.metal; g.lineWidth = 4; g.beginPath(); g.arc(x - 6, y, 19, -1.2, 1.2); g.stroke(); ligne('#e9dcc0', 4, x - 18, y, x + 22, y); }
    else if (a === 'mortier') { ligne(P.metal, 15, x - 6, y + 10, x + 8, y - 10); rond('#1d1a18', x + 14, y - 18, 7); rond('#555', x - 8, y + 14, 8); }
    else if (a === 'barricade') { for (let k = 0; k < 4; k++) poly(k % 2 ? P.pierre : P.metal, x - 24 + k * 12, y + 20, x - 17 + k * 12, y - 20, x - 10 + k * 12, y + 20); }
    else if (a === 'mine') { rond('#e5b93c', x, y, 19); rond('#f8db74', x, y, 13); texte('+', x, y + 1, 24, '#8a6511', 'center', true); }
    else if (a === 'age') poly(P.accent, x, y - 22, x + 20, y, x + 8, y, x + 8, y + 20, x - 8, y + 20, x - 8, y, x - 20, y);
  }
  function panneau(i) {
    const x0 = 14 + i * 793, y0 = 598, w = 779, j = partie.joueurs[i], C = COUL.j[i], hum = humain(i);
    rect(x0, y0, w, 294, 16, 'rgba(24,27,25,.95)', C, 3);
    texte(present(i) ? nomJoueur(i) : 'Allié IA', x0 + 18, y0 + 27, 23, C, 'left', true);
    rond('#e5b93c', x0 + 150, y0 + 26, 11);
    texte(Math.floor(j.or) + '', x0 + 168, y0 + 27, 24, refus[i] > 0 ? '#ff7766' : '#ffe08a', 'left', true);
    texte('+' + partie.revenu(j).toFixed(1).replace('.', ',') + '/s', x0 + 238, y0 + 28, 16, '#c9c2a8');
    texte(partie.compte(i) + '/' + S.MAX_UNITES[i] + ' soldats', x0 + 318, y0 + 28, 16, '#c9c2a8');
    texte(hum ? (enLigne() ? 'ZQSD ou flèches + Espace' : i === 0 ? 'ZQSD + Espace' : 'Flèches + Entrée') + '  ·  ou souris' : present(i) ? 'En ligne' : 'Joue tout seul', x0 + w - 18, y0 + 28, 15, '#9aa39d', 'right');
    S.ACTIONS.forEach((a, k) => {
      const bw = 146, bh = 98, x = x0 + 13 + (k % 5) * 152, y = y0 + 50 + Math.floor(k / 5) * 104;
      const b = partie.blocage(i, a), prix = partie.cout(i, a), non = b && b !== '…';
      const sel = hum && curseur[i] === k;

      rect(x, y, bw, bh, 10, appelAutre && Math.sin(performance.now() / 90) > 0 ? '#7a5d16' : non ? '#232725' : '#34403a', sel ? '#fff' : '#48544d', sel ? 4 : 1.5);
      g.save(); if (non) g.globalAlpha = 0.45; icone(a, x + 32, y + 50, i); g.restore();
      texte(nomAction(a), x + 64, y + 22, 17, non ? '#9aa39d' : '#fff', 'left', true, 78);
      if (prix > 0) texte(prix + ' or', x + 64, y + 46, 16, j.or >= prix ? '#ffe08a' : '#e07a66', 'left', true);
      let info = '';
      if (a in j.def) info = j.def[a] + '/3';
      else if (a === 'mine') info = j.mines + '/6';

      else if (S.UNITES[a]) info = partie.compte(i, a) || '';
      if (non && b !== 'Pas assez d\'or') info = b;
      if (appelAutre) info = 'Répondez !';
      texte(info + '', x + 64, y + (a === 'assaut' ? 52 : 68), 14, appelAutre ? '#ffd04a' : '#aab5ae', 'left', false, 78);
      if (a === 'assaut') jauge(x + 64, y + 74, 72, 8, partie.camps[0].jauge / 100, '#ffd04a');
      if (a === 'age' && partie.coutAge(0)) jauge(x + 64, y + 82, 72, 8, partie.camps[0].fonds / partie.coutAge(0), PAL[partie.camps[0].age].accent);
    });
    texte(hum ? TXT[S.ACTIONS[curseur[i]]] : present(i) ? 'Votre ami décide ici. L\'or de chacun est séparé.' : 'Il économise, recrute, défend et répond à vos assauts.', x0 + 18, y0 + 273, 17, '#d8dfd9', 'left', false, w - 36);
  }
  function bandeau() {

    texte('Échap pause · V vitesse ×' + vitesse + ' · M son ' + (sauve.muet ? 'coupé' : 'actif'), 800, 78, 14, 'rgba(255,255,255,.85)', 'center');
  }
  function voile(o) { g.fillStyle = 'rgba(10,9,9,' + o + ')'; g.fillRect(0, 0, W, H); }

  function ecranTitre(t) {
    decor(t); voile(0.5);
    texte('CENDRES ET REMPARTS', 800, 150, 78, '#ffe3b0', 'center', true);
    texte('Deux alliés, un château à faire tomber. Chaque défaite vous rend plus forts.', 800, 220, 25, '#eee', 'center');
    const a = S.adversaire(sauve.niveau);
    texte('Prochain adversaire : n° ' + sauve.niveau + ', ' + a.nom + ', ' + a.titre, 800, 285, 24, '#ff9aa0', 'center', true);
    texte('Morts : ' + sauve.morts + '  ·  Renforts acquis : ' + Object.values(sauve.renforts).reduce((s, n) => s + n, 0), 800, 320, 19, '#ccc', 'center');

    bouton(560, 515, 480, 72, 'Jouer seul avec un allié IA', () => lancerSelon(true), 'ZQSD + Espace, ou la souris');
    bouton(640, 598, 320, 42, confirmer > 0 ? 'Vraiment tout effacer ?' : 'Recommencer à zéro', () => {
      if (confirmer > 0) { sauve = Object.assign(neuf(), { muet: sauve.muet }); garder(); confirmer = 0; } else confirmer = 3;

      'Défenses : balistes et mortiers sur le rempart, barricade devant la porte.',
      'Économie : chacun a son or. Les mines rapportent, le pot commun fait monter tout le monde en âge.',
      'Après 3 min 30, la pluie de cendres ronge les deux châteaux : le plus abîmé tombe le premier.',
    ].forEach((s, k) => texte(s, 800, 680 + k * 36, 20, '#e6e0d2', 'center'));
    texte('M : couper ou remettre le son', 800, 840, 17, '#bbb', 'center');
  }
  function ecranChoix(t) {
    decor(t); voile(0.72);
    const v = sauve.resultat === 'victoire', fini = choixFini(), a = S.adversaire(sauve.niveau);
    texte(v ? 'VICTOIRE !' : 'LE CHÂTEAU EST TOMBÉ', 800, 90, 62, v ? '#bff0a0' : '#ff9a8a', 'center', true);
    texte(fini ? 'Prochain combat : n° ' + sauve.niveau + ', ' + a.nom + ', ' + a.titre + '. ' + a.desc : 'Choisissez sur quel point vous renforcer, pour toujours.', 800, 150, 24, '#eee', 'center', false, 1500);

    });
    Object.keys(S.RENFORTS).forEach((c, k) => {
      const R = S.RENFORTS[c], n = sauve.renforts[c] || 0, w = 340, h = 206, x = 84 + (k % 4) * 364, y = 236 + Math.floor(k / 4) * 230;
      const sur = !fini && zone(x, y, w, h, () => choisir(enLigne() ? moi() : sauve.choix[0] > 0 ? 0 : 1, k));
      rect(x, y, w, h, 16, sur ? '#37433c' : '#232926', '#4b564f', 2);
      if (!fini) [0, 1].forEach(i => { if (humain(i) && sauve.choix[i] > 0 && curChoix[i] === k) rect(x - 2 - i * 5, y - 2 - i * 5, w + 4 + i * 10, h + 4 + i * 10, 18, null, COUL.j[i], 5); });
      texte(R.nom, x + 20, y + 36, 29, '#ffe3b0', 'left', true);

      texte((n ? pc(n) : '0 %') + (fini ? '' : '  →  ' + pc(n + 1)), x + 20, y + 120, 27, '#fff', 'left', true);
      for (let m = 0; m < 5; m++) rect(x + 20 + m * 61, y + 154, 54, 12, 6, m < n % 5 ? '#9fd16b' : '#3d4741');
      const dbl = (n + 1) % 5 === 0;
      texte(dbl ? 'Le prochain niveau compte double !' : 'Niveau double : le n° ' + (Math.floor(n / 5) + 1) * 5, x + 20, y + 186, 15, dbl ? '#ffd04a' : '#95a099');
    });
    if (fini) bouton(560, 712, 480, 82, 'Au combat !', () => { if (depuis > 0.4) lancer(); }, 'Espace ou Entrée');
    else texte(enLigne() || mode === 'solo' ? (sauve.choix[moi()] ? 'ZQSD puis Espace, ou clic' : 'Votre ami choisit…') : 'Joueur 1 : ZQSD puis Espace  ·  Joueur 2 : Flèches puis Entrée  ·  au clic : Joueur 1 d\'abord', 800, 755, 20, '#ccc', 'center');
    bouton(660, 815, 280, 48, 'Menu', versMenu);
  }

  // --- Boucle ---------------------------------------------------------------------
  let avant = performance.now(), reste = 0, horloge = 0;
  function avancer(dt) {
    horloge += dt; depuis += dt; confirmer = Math.max(0, confirmer - dt);
    refus = refus.map(v => Math.max(0, v - dt)); secousse = Math.max(0, secousse - dt);
    if (ecran === 'jeu' && !pause) {
      if (mode === 'invite') partie.lisser(dt * vitesse);
      else if (!partie.fini) {
        reste += dt * vitesse;
        while (reste >= 1 / 60) { partie.pas(1 / 60); reste -= 1 / 60; }
        if (partie.fini) depuis = 0;
      }
      evenements();
      if (annonce) { annonce.t -= dt; if (annonce.t <= 0) annonce = null; }
      if (partie.fini && depuis > 2 && mode !== 'invite') finir();
    }
    photographier(dt);
    for (const q of part) { q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt; }
    part = part.filter(q => q.t > 0);
  }
  function dessiner() {
    zones = [];
    g.clearRect(0, 0, W, H);
    if (ecran === 'titre' || ecran === 'reseau') { ecranTitre(horloge); if (ecran === 'reseau') zones = []; return; }
    if (ecran === 'choix') { ecranChoix(horloge); return; }
    g.save();
    if (secousse > 0) g.translate((Math.random() - 0.5) * secousse * 30, (Math.random() - 0.5) * secousse * 30);
    decor(horloge);
    [...partie.unites].sort((a, b) => a.voie - b.voie).forEach(u => soldat(u, horloge));
    tirs();
    for (const q of part) { g.globalAlpha = Math.min(1, q.t * 2); rond(q.c, q.x, q.y, q.r); }
    g.restore();
    bandeau(); panneau(0); panneau(1);
    if (annonce && !partie.fini) {
      g.globalAlpha = Math.min(1, annonce.t * 2);
      texte(annonce.a, 800, 165, 42, '#fff4d8', 'center', true, 1400); texte(annonce.b, 800, 208, 22, '#fff', 'center', false, 1400);
      g.globalAlpha = 1;
    }
    if (partie.fini) texte(partie.fini === 'victoire' ? 'VICTOIRE !' : 'DÉFAITE', 800, 310, 90, partie.fini === 'victoire' ? '#bff0a0' : '#ff9a8a', 'center', true);
    if (pause) {
      zones = []; voile(0.65);
      texte('PAUSE', 800, 300, 80, '#fff', 'center', true);
      const paye = partie.t >= 120; // sinon on pourrait accumuler des renforts sans jouer
      bouton(600, 380, 400, 70, 'Reprendre', basculerPause);
      if (mode !== 'invite') bouton(600, 470, 400, 70, 'Abandonner ce combat', () => { pause = false; sansRenfort = !paye; partie.fini = 'defaite'; depuis = 2; }, paye ? 'Compte comme une mort, avec renfort' : 'Pas de renfort avant 2 minutes de combat');
      bouton(600, 560, 400, 70, enLigne() ? 'Quitter la partie en ligne' : 'Retour au menu', versMenu, mode === 'invite' ? 'Une IA prendra votre place' : 'Le combat en cours est perdu, sans mort ni renfort');
    }
  }
  function taille() {
    const k = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px';
  }
  addEventListener('resize', taille); taille();
  function tic() {
    const n = performance.now();
    avancer(Math.max(0, Math.min(0.25, (n - avant) / 1000))); avant = n;
  }
  function boucle() { tic(); dessiner(); requestAnimationFrame(boucle); }
  // Onglet caché : le navigateur arrête l'affichage, mais la partie en ligne doit continuer.
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),50)'], { type: 'text/javascript' })));
    w.onmessage = () => { if (enLigne() && performance.now() - avant > 120) tic(); };
  } catch (e) { /* pas de tâche de fond : la partie ralentit si l'onglet est caché */ }
  addEventListener('pagehide', () => { if (net) net.fermer(); });
  requestAnimationFrame(boucle);
  // Accès pour les essais depuis la console
  window.Jeu = { get partie() { return partie; }, get sauve() { return sauve; }, get ecran() { return ecran; }, get pause() { return pause; }, get mode() { return mode; }, get ami() { return ami; }, get net() { return net; }, avancer, dessiner };
})();
